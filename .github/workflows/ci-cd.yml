name: CI - CRM Eurovia (sem deploy automatico)

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next lint inicia um assistente interativo sem .eslintrc; manter
      # checagem de tipos ate a migracao revisada para ESLint CLI.
      - run: pnpm --filter @crm/web exec tsc --noEmit

  test-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-with-at-least-32-chars-aaaaaaaa
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public
      SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/api
        run: pnpm prisma:generate
      - working-directory: apps/api
        run: pnpm vitest run

  build:
    name: Build
    needs: [typecheck, test-api]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public
      JWT_SECRET: ci-build-secret-with-at-least-32-chars-aaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - name: Validate compiled CommonJS Vercel handler
        shell: bash
        env:
          NODE_ENV: test
          JWT_SECRET: ci-handler-secret-with-at-least-32-characters-aaaa
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          SYNC_ENABLED: 'false'
          SYONET_USE_REAL: 'false'
        run: |
          set -euo pipefail
          node --check apps/api/dist/api/index.js
          node <<'NODE'
          const handler = require('./apps/api/dist/api/index.js').default;
          let statusCode = 200;
          let body = '';
          const req = { method: 'GET', url: '/api/cron/health', headers: {}, body: undefined, query: {} };
          const res = {
            headersSent: false,
            status(code) { statusCode = code; return this; },
            setHeader() {},
            send(value) { body = String(value); this.headersSent = true; return this; },
            json(value) { body = JSON.stringify(value); this.headersSent = true; return this; },
          };
          Promise.resolve(handler(req, res)).then(() => {
            const parsed = JSON.parse(body);
            if (statusCode !== 200 || parsed.status !== 'ok' || parsed.service !== 'cron-jobs') {
              console.error({ statusCode, body });
              process.exit(1);
            }
            console.log('Compiled Vercel handler OK');
          }).catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Validate Vercel API-only configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('apps/api/vercel.json','utf8'));
          const fail = (m) => { console.error(m); process.exit(1); };
          if (cfg.buildCommand !== undefined) fail('API-only Vercel config must not define buildCommand');
          if (cfg.outputDirectory !== undefined) fail('API-only Vercel config must not define outputDirectory');
          if (cfg.framework !== undefined) fail('API-only Vercel config must not use framework autodetection');
          if (!Array.isArray(cfg.builds) || cfg.builds.length !== 1) fail('Expected exactly one explicit build target');
          if (cfg.builds[0].src !== 'api/index.ts' || cfg.builds[0].use !== '@vercel/node') fail('Unexpected Vercel Function build target');
          const rule = cfg.git?.deploymentEnabled?.['fix/eurovia-hardening-deploy-20261015'];
          if (rule !== false) fail('Security branch auto-deploy must remain disabled');
          console.log('Vercel API-only config OK');
          NODE
      - name: Validate Vercel API package phase
        shell: bash
        run: |
          set -euo pipefail
          cd apps/api
          rm -rf node_modules package-lock.json
          npm install --package-lock=false
          test -f node_modules/fastify/fastify.js -o -f node_modules/fastify/index.js
          node -e "import('fastify').then(()=>console.log('fastify package OK'))"

